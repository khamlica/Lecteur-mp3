# Construit l'installeur Windows et le publie comme Release GitHub à chaque étiquette de version
# (v1.2.3), créée par `npm run release`. Les apps installées la récupèrent toutes seules.
name: Publier une version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # créer la Release et y déposer l'installeur

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Jeton en lecture seule qui permet à l'app de lire les Releases de ce dépôt privé.
      # Il vient du secret UPDATE_TOKEN et n'existe que dans l'installeur.
      - name: Ajouter le jeton de mise à jour
        shell: bash
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then echo "::error::Secret UPDATE_TOKEN manquant"; exit 1; fi
          printf '{"token":"%s"}' "$UPDATE_TOKEN" > src/update-token.json

      - name: Construire l'installeur
        run: npx electron-builder --win nsis --publish never

      # Envoi par gh plutôt que par electron-builder (la version 1.1.0 n'avait reçu que le .blockmap) :
      # les trois fichiers sont vérifiés, déposés (en remplaçant ceux déjà présents), puis listés.
      # latest.yml est celui que lisent les apps installées pour trouver la mise à jour.
      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          files=("dist/Hanabi-Player-Setup-$version.exe" "dist/Hanabi-Player-Setup-$version.exe.blockmap" "dist/latest.yml")
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::Fichier manquant : $f"; ls -la dist; exit 1; fi
          done
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$version" --notes "Version $version"
          fi
          echo "Fichiers de la Release $tag :"
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
