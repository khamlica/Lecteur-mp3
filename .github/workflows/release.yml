# Construit l'installeur Windows et l'app Android, et les publie comme Release GitHub à chaque étiquette de
# version (v1.2.3), créée par `npm run release`. Les apps installées la récupèrent toutes seules.
name: Publier une version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # créer la Release et y déposer l'installeur

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire l'installeur
        run: npx electron-builder --win nsis --publish never

      # Envoi par gh plutôt que par electron-builder (la version 1.1.0 n'avait reçu que le .blockmap) :
      # les trois fichiers sont vérifiés, déposés (en remplaçant ceux déjà présents), puis listés.
      # latest.yml est celui que lisent les apps installées pour trouver la mise à jour.
      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          files=("dist/Hanabi-Player-Setup-$version.exe" "dist/Hanabi-Player-Setup-$version.exe.blockmap" "dist/latest.yml")
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::Fichier manquant : $f"; ls -la dist; exit 1; fi
          done
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$version" --notes "Version $version"
          fi
          echo "Fichiers de la Release $tag :"
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'

  # App Android (android/) : l'APK, signé avec la clé de l'app, déposé dans la même Release. Les téléphones le
  # trouvent là (Updater.kt) et proposent de l'installer.
  android:
    needs: build # la Release existe déjà
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # La clé de signature : un APK signé autrement ne pourrait pas remplacer celui déjà installé
      - name: Ajouter la clé de signature
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then echo "::error::Secret ANDROID_KEYSTORE manquant"; exit 1; fi
          echo "$ANDROID_KEYSTORE" | base64 -d > android/release.jks

      - name: Construire l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          apk="Hanabi-Player-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "${GITHUB_REF_NAME}" "$apk" --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[] | "\(.name) \(.size)"'
