<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self'; frame-src 'self'">
  <title>Hanabi Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fx-themes.css">
  <link rel="stylesheet" href="android/mobile.css">
</head>
<body>
  <!-- Le lecteur de bureau (index.html) en plein écran, pour le téléphone : mêmes éléments, mêmes identifiants (le
       même renderer.js les pilote), disposés en hauteur ; les fenêtres de réglages s'ouvrent dans un panneau (host.js) -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M8.5 6.2L18 12l-9.5 5.8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="3.8" height="13" rx="1.2" fill="currentColor"/><rect x="13.7" y="5.5" width="3.8" height="13" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6.5 7L14 12l-7.5 5z"/><rect x="16" y="6" width="2.4" height="12" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M17.5 7L10 12l7.5 5z"/><rect x="5.6" y="6" width="2.4" height="12" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M3.5 7.5h2.6c1.9 0 3 .8 4 2.4l2.6 4.2c1 1.6 2.1 2.4 4 2.4H20M3.5 16.5h2.6c1.1 0 1.9-.3 2.6-.9M14.7 8.4c.7-.6 1.5-.9 2.6-.9H20M17.5 5l2.5 2.5-2.5 2.5M17.5 14l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M17 3.5L19.5 6 17 8.5M4.5 11.5V10a4 4 0 0 1 4-4h11M7 20.5L4.5 18 7 15.5M19.5 12.5V14a4 4 0 0 1-4 4h-11"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M17 3.5L19.5 6 17 8.5M4.5 11.5V10a4 4 0 0 1 4-4h11M7 20.5L4.5 18 7 15.5M19.5 12.5V14a4 4 0 0 1-4 4h-11M11 10.5l1.2-.8v4.6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 9.5h3l4.5-4v13L7 14.5H4zM15 9.3a3.8 3.8 0 0 1 0 5.4M17.6 6.7a7.5 7.5 0 0 1 0 10.6"/></symbol>
    <symbol id="i-volume-low" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 9.5h3l4.5-4v13L7 14.5H4zM15 9.3a3.8 3.8 0 0 1 0 5.4"/></symbol>
    <symbol id="i-volume-off" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 9.5h3l4.5-4v13L7 14.5H4zM15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M3.5 7.5a2 2 0 0 1 2-2h3.7l2 2h7.3a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6.5 9.5L12 15l5.5-5.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14.5 6.5L9 12l5.5 5.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9.5 6.5L15 12l-5.5 5.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M9.5 17.5V6.5l9-2v11M9.5 17.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM18.5 15.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v10M7.5 10.5L12 15l4.5-4.5M5.5 19.5h13"/></symbol>
    <symbol id="i-fx" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M10.5 5c.7 4 2.6 5.9 6.5 6.5-3.9.6-5.8 2.5-6.5 6.5-.7-4-2.6-5.9-6.5-6.5 3.9-.6 5.8-2.5 6.5-6.5zM18.5 2.8c.3 1.4.9 2 2.2 2.2-1.3.3-1.9.9-2.2 2.2-.3-1.3-.9-1.9-2.2-2.2 1.3-.2 1.9-.8 2.2-2.2z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
  </svg>

  <div id="bar" class="fx-surface" data-fx-theme="glass" data-fx-base="glass">
    <div class="fx-palette"></div><div class="fx-bass"></div>
    <div class="fx-lift"></div><div class="fx-sparkles"></div><div class="fx-frame"></div>

    <div id="window-btns">
      <button class="btn small" id="close" title="Réduire (le widget garde la main)"><svg><use href="#i-down"/></svg></button>
      <button class="btn small" id="youtube" title="Télécharger l'audio d'une vidéo YouTube"><svg><use href="#i-download"/></svg></button>
      <button class="btn small" id="fx" title="Effets"><svg><use href="#i-fx"/></svg></button>
      <button class="btn small" id="folder" title="Choisir une piste ou un dossier"><svg><use href="#i-folder"/></svg></button>
    </div>

    <div id="cover" class="fx-cover" title="Modifier le titre, l'artiste et la pochette">
      <img id="cover-img" alt="" hidden>
      <svg class="edit"><use href="#i-edit"/></svg>
    </div>

    <div id="body">
      <div class="row">
        <div id="info">
          <div id="title">Hanabi Player</div>
          <div id="artist"></div>
        </div>

        <div id="yt">
          <div class="yt-field">
            <svg><use href="#i-link"/></svg>
            <input id="yt-url" type="url" placeholder="Coller un lien YouTube…" spellcheck="false" autocomplete="off" enterkeyhint="go">
          </div>
          <div id="yt-status"></div>
        </div>
      </div>

      <div class="row seek">
        <input type="range" id="progress" min="0" max="1000" value="0" step="1">
        <div class="times"><span class="time" id="time-cur">0:00</span><span class="time" id="time-dur">0:00</span></div>
      </div>

      <div id="transport">
        <button class="btn" id="shuffle" title="Lecture aléatoire"><svg><use href="#i-shuffle"/></svg></button>
        <button class="btn" id="prev" title="Précédent"><svg><use href="#i-prev"/></svg></button>
        <button class="btn play" id="play" title="Lecture"><svg><use id="play-icon" href="#i-play"/></svg></button>
        <button class="btn" id="next" title="Suivant"><svg><use href="#i-next"/></svg></button>
        <button class="btn" id="repeat" title="Répétition : désactivée"><svg><use id="repeat-icon" href="#i-repeat"/></svg></button>
      </div>

      <div class="row bottom">
        <button class="btn small" id="mute" title="Couper le son"><svg><use id="mute-icon" href="#i-volume"/></svg></button>
        <input type="range" id="volume" min="0" max="100" value="80" step="1">
      </div>
    </div>
  </div>

  <!-- Choix d'un dossier ou d'une piste (le choix de fichiers d'Android ne donne pas de chemin, voir host.js) -->
  <div id="browser" class="layer sheet-layer" hidden>
    <div class="backdrop"></div>
    <div class="sheet">
      <header>
        <button class="btn small" id="browser-up" title="Dossier parent"><svg><use href="#i-back"/></svg></button>
        <div class="where"><div id="browser-name"></div><div id="browser-path"></div></div>
        <button class="btn small" id="browser-close" title="Fermer"><svg><use href="#i-down"/></svg></button>
      </header>
      <div id="browser-list"></div>
      <div id="browser-access" hidden>
        <p>Pour lire votre musique et y enregistrer les téléchargements, Hanabi Player a besoin d'accéder aux fichiers du téléphone.</p>
        <button class="action primary" id="browser-allow">Autoriser l'accès</button>
      </div>
      <footer>
        <div class="hint">Touchez une piste pour lire son dossier à partir d'elle</div>
        <button class="action primary" id="browser-pick">Lire ce dossier</button>
      </footer>
    </div>
  </div>

  <script src="android/host.js"></script>
  <script src="sound.js"></script>
  <script src="effects.js"></script>
  <script src="cover.js"></script>
  <script src="renderer.js"></script>
  <script src="android/after.js"></script>
</body>
</html>
