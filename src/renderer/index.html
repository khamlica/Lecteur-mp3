<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' file:">
  <title>Hanabi Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fx-themes.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
    <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="i-fx" viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
  </svg>

  <div id="bar" class="fx-surface" data-fx-theme="aurora">
    <div class="fx-bass"></div>
    <div class="fx-flash"></div><div class="fx-lift"></div><div class="fx-sparkles"><i></i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    <div class="fx-notes"></div>
    <div class="fx-melody"></div>
    <div id="cover" class="fx-cover" title="Modifier le titre, l'artiste et la pochette">
      <img id="cover-img" alt="" hidden>
      <svg class="edit"><use href="#i-edit"/></svg>
    </div>

    <div id="body">
      <div class="row">
        <div id="info">
          <div id="title">Hanabi Player</div>
          <div id="artist"></div>
        </div>

        <div id="yt">
          <input id="yt-url" type="text" placeholder="Coller un lien YouTube…" spellcheck="false" autocomplete="off">
          <div id="yt-status"></div>
        </div>

        <div id="transport">
          <button class="btn" id="shuffle" title="Lecture aléatoire"><svg><use href="#i-shuffle"/></svg></button>
          <button class="btn" id="prev" title="Précédent"><svg><use href="#i-prev"/></svg></button>
          <button class="btn play" id="play" title="Lecture"><svg><use id="play-icon" href="#i-play"/></svg></button>
          <button class="btn" id="next" title="Suivant"><svg><use href="#i-next"/></svg></button>
          <button class="btn" id="repeat" title="Répétition : désactivée"><svg><use id="repeat-icon" href="#i-repeat"/></svg></button>
        </div>

        <div id="window-btns">
          <button class="btn small" id="youtube" title="Télécharger l'audio d'une vidéo YouTube"><svg><use href="#i-download"/></svg></button>
          <button class="btn small" id="fx" title="Effets"><svg><use href="#i-fx"/></svg></button>
          <button class="btn small" id="folder" title="Changer de dossier"><svg><use href="#i-folder"/></svg></button>
          <button class="btn small" id="close" title="Réduire dans la zone de notification"><svg><use href="#i-close"/></svg></button>
        </div>
      </div>

      <div class="row bottom">
        <span class="time" id="time-cur">0:00</span>
        <input type="range" id="progress" min="0" max="1000" value="0" step="1">
        <span class="time" id="time-dur">0:00</span>
        <button class="btn small" id="mute" title="Couper le son"><svg><use id="mute-icon" href="#i-volume"/></svg></button>
        <input type="range" id="volume" min="0" max="100" value="80" step="1">
      </div>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="effects.js"></script>
  <script src="cover.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
